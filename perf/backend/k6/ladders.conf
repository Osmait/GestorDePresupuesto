# endpoint            comma-separated arrival rates (req/s; dashboard = page loads/s)   [max VUs]
# Every ladder contains 50 req/s (dashboard: 10 page loads/s, login: 10/s),
# which RESULTS.md uses as the "moderate load" point.
# Reads first, writes last: a round reseeds the DB before it starts, so the
# rows written by create_tx/cc_payment/mixed never leak into read ladders.
accounts              25,50,100,150,200,250,300,400
budgets               50,100,200,300,400,500,600
dash_summary          25,50,100,150,200,250,300
tx_recent             50,200,500,1000,1500,2000,3000
tx_list_name          50,200,400,700,1000,1500,2000
analytics_cat_1y      10,25,50,75,100,125,150,200
analytics_summary_1y  10,25,50,75,100,125,150
analytics_monthly     10,25,50,75,100,125,150,200
dashboard             5,10,20,40,60,80,100
login                 10,20,40,60,90,120,160,200
refresh               50,100,200,300,450,600,800
create_tx             25,50,100,150,200,300,450
# feature-gated route (RequireFeature): >= 25 requests in flight deadlock the
# pool, so concurrency is capped at 20 VUs; saturation shows up as dropped
# iterations / achieved < target instead of a wedged server.
cc_payment            5,10,20,30,40,50,75       20
mixed                 50,100,200,300,400,600,800
