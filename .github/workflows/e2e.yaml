name: E2E Tests

on:
  pull_request:
    paths:
      - 'BackEnd/**'
      - 'FrontendNextjs/**'
      - 'e2e-test/**'
      - 'go.work'
      - '.github/workflows/e2e.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- Setup Backend toolchain ---
      # e2e-test/global-setup.ts starts its own PostgreSQL (testcontainers) and
      # builds + spawns the Go backend, so only the Go toolchain is needed here.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: BackEnd/go.mod
          cache-dependency-path: BackEnd/go.sum

      # --- Setup Frontend Environment ---
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: FrontendNextjs/gestor/package.json
          cache: 'npm'
          cache-dependency-path: |
            FrontendNextjs/gestor/package-lock.json
            e2e-test/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./FrontendNextjs/gestor
        run: npm ci

      # --- Setup Playwright ---
      - name: Install Playwright Dependencies
        working-directory: ./e2e-test
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # --- Run E2E Tests ---
      # global-setup.ts: testcontainers PostgreSQL + compiled Go backend.
      # playwright.config.ts webServer: Next.js dev server.
      # NEXTAUTH_SECRET only signs the session cookies of this throwaway dev
      # server, so a fresh random one per run is enough. It is generated
      # instead of read from secrets because GitHub does not pass Actions
      # secrets to runs triggered by Dependabot (MissingSecret on every
      # Dependabot PR).
      - name: Generate NextAuth secret
        run: echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run Playwright Tests
        run: make test-e2e
        env:
          NEXTAUTH_URL: "http://localhost:3000"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e-test/playwright-report/
          retention-days: 7
