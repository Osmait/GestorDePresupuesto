name: Backend Quality

on:
  push:
    branches: [main, development]
    paths:
      - 'BackEnd/**'
      - 'go.work'
      - '.github/workflows/backend.yaml'
  pull_request:
    paths:
      - 'BackEnd/**'
      - 'go.work'
      - '.github/workflows/backend.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./BackEnd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: BackEnd/go.mod
          cache-dependency-path: BackEnd/go.sum

      - name: Verify Dependencies
        run: go mod verify

      # Using dedicated action for better caching and performance
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: BackEnd
          args: --timeout=5m

      - name: Build
        run: make build

      - name: Test
        run: make test

  # API end-to-end suite (build tag `e2e`): the real router from
  # cmd/api/boostrap against a PostgreSQL started by testcontainers (Docker is
  # available on GitHub-hosted ubuntu runners).
  backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./BackEnd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: BackEnd/go.mod
          cache-dependency-path: BackEnd/go.sum

      - name: Vet E2E
        run: go vet -tags e2e ./internal/e2e/...

      - name: E2E Tests
        run: make e2e-api
