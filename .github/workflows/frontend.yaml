name: Frontend Quality

on:
  push:
    branches: [main, development]
    paths:
      - 'FrontendNextjs/**'
      - '.github/workflows/frontend.yaml'
  pull_request:
    paths:
      - 'FrontendNextjs/**'
      - '.github/workflows/frontend.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./FrontendNextjs/gestor

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: FrontendNextjs/gestor/package.json
          cache: 'npm'
          cache-dependency-path: './FrontendNextjs/gestor/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
