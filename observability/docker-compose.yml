# Local observability stack: OTel Collector -> Jaeger (traces) + Prometheus
# (metrics) + Grafana (dashboards). See README.md. `make obs-up` / `make obs-down`.
#
# Every host port is bound to 127.0.0.1 and overridable (see .env.example).
name: obs

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: obs-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OBS_OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC (Go backend)
      - "127.0.0.1:${OBS_OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP (Next.js)
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.13.0
    container_name: obs-jaeger
    ports:
      - "127.0.0.1:${OBS_JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: obs-prometheus
    # prometheus.yml is a template: the backend target and its bearer token
    # come from the environment (Prometheus does not expand env vars itself).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s|__BACKEND_METRICS_TARGET__|$${BACKEND_METRICS_TARGET}|"
        -e "s|__METRICS_TOKEN__|$${METRICS_TOKEN}|"
        /etc/prometheus/prometheus.tmpl.yml > /tmp/prometheus.yml &&
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d
        --web.enable-lifecycle
    environment:
      BACKEND_METRICS_TARGET: ${BACKEND_METRICS_TARGET:-host.docker.internal:9464}
      METRICS_TOKEN: ${METRICS_TOKEN:-local-dev-metrics-token-change-me}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.tmpl.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${OBS_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    container_name: obs-grafana
    environment:
      # Local only: anonymous admin, no login screen.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-red.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${OBS_GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

volumes:
  prometheus-data:
