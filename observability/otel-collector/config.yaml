# OTLP in (Go backend over gRPC, Next.js over HTTP) ->
#   traces  -> Jaeger
#   metrics -> Prometheus exporter on :8889 (scraped by Prometheus)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    timeout: 1s
  # Defence in depth: never store client addresses even if an SDK adds them.
  attributes/scrub:
    actions:
      - key: client.address
        action: delete
      - key: http.client_ip
        action: delete
      - key: net.sock.peer.addr
        action: delete

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # job = service.name, so dashboards can tell frontend from backend.
    resource_to_telemetry_conversion:
      enabled: false
    enable_open_metrics: true
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
